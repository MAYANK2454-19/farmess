name: Feature / implementation task
description: A scoped Farmess feature with acceptance criteria
body:
  - type: textarea
    id: user_story
    attributes:
      label: User story
      description: Who needs this and what should they be able to do?
      placeholder: As a farmer, I want ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable behaviours and edge states.
    validations:
      required: true
  - type: dropdown
    id: lane
    attributes:
      label: Initial lane
      options:
        - Mayank — app shell / integration
        - Prince — auth / database / RLS
        - Bhavishya — UI / Figma parity
        - Yash — market data
        - Rajan — net-return / comparison
        - Atharv — marketplace / QA
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / shared files
      description: List required interfaces, migrations, routes or files that may overlap.
  - type: textarea
    id: tests
    attributes:
      label: Tests and evidence
      description: Unit, security, responsive and screenshot checks needed.
