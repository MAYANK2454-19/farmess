name: Cold storage planner tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cold-storage:
    name: Cold storage domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Preview Prettier output for planner files
        run: |
          npx prettier --write src/features/logistics/cold-storage.ts src/features/logistics/cold-storage.test.ts
          git diff -- src/features/logistics/cold-storage.ts src/features/logistics/cold-storage.test.ts
      - name: Cold storage unit tests
        run: node --experimental-strip-types --test src/features/logistics/cold-storage.test.ts
