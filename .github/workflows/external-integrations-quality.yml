name: External integrations quality

on:
  push:
    branches:
      - feat/farmess-external-integrations

permissions:
  contents: read

concurrency:
  group: external-integrations-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, lint, typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting against integration base
        run: |
          git fetch origin feat/ml-data-export-foundation:refs/remotes/origin/feat/ml-data-export-foundation
          BASE_SHA="$(git merge-base origin/feat/ml-data-export-foundation HEAD)"
          FORMAT_BASE_SHA="$BASE_SHA" FORMAT_HEAD_SHA="$(git rev-parse HEAD)" npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ML utilities
        run: |
          python -m compileall -q ml
          python -m unittest discover -s ml/tests -v

      - name: Production build
        run: npm run build
