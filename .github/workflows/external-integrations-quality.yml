name: External integrations quality

on:
  push:
    branches:
      - feat/farmess-external-integrations

permissions:
  contents: write
  actions: write

concurrency:
  group: external-integrations-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, Python validation and CI dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format weather integration files
        run: |
          npx prettier --write \
            src/app/api/weather/forecast/route.ts \
            src/lib/weather/forecast.ts \
            src/lib/weather/forecast.test.ts
          npx prettier --check \
            src/app/api/weather/forecast/route.ts \
            src/lib/weather/forecast.ts \
            src/lib/weather/forecast.test.ts

      - name: Validate Python ML utilities
        run: |
          python -m compileall -q ml
          python -m unittest discover -s ml/tests -v

      - name: Commit formatting updates
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/app/api/weather/forecast/route.ts \
            src/lib/weather/forecast.ts \
            src/lib/weather/forecast.test.ts
          if git diff --cached --quiet; then
            echo "Weather integration files are already formatted."
          else
            git commit -m "style(weather): format forecast integration"
            git push origin "HEAD:refs/heads/$BRANCH_NAME"
          fi

      - name: Dispatch full CI against the updated branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH_NAME\"}"
