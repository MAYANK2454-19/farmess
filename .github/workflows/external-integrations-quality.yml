name: External integrations quality

on:
  pull_request:
    branches:
      - feat/ml-data-export-foundation
  push:
    branches:
      - feat/farmess-external-integrations

permissions:
  contents: read

concurrency:
  group: external-integrations-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format, lint, typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting
        run: npm run format:check
        env:
          FORMAT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FORMAT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate ML utilities
        run: |
          python -m compileall -q ml
          python -m unittest discover -s ml/tests -v

      - name: Production build
        run: npm run build
