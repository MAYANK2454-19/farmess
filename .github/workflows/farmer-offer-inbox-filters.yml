name: Farmer offer inbox filters

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/offers/offer-inbox-filters.ts"
      - "src/features/offers/offer-inbox.test.ts"
      - "src/features/offers/offer-inbox.tsx"
      - ".github/workflows/farmer-offer-inbox-filters.yml"
  push:
    branches:
      - "feat/farmer-offer-inbox-filters"

permissions:
  contents: read

jobs:
  offer-inbox:
    name: Farmer offer inbox filter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository dependencies
        run: npm ci

      - name: Run farmer offer inbox tests
        run: node --experimental-strip-types --test src/features/offers/offer-inbox.test.ts
