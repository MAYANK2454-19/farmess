name: Temporary formatter export

on:
  push:
    branches:
      - feat/m6-marketplace-lifecycle-qa

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format lifecycle test
        run: npx prettier --write src/features/marketplace/lifecycle-journey.test.ts
      - name: Export formatted source
        run: |
          echo BEGIN_FORMATTED_BASE64
          base64 -w0 src/features/marketplace/lifecycle-journey.test.ts
          echo
          echo END_FORMATTED_BASE64
