name: Temporary formatter export

on:
  push:
    branches:
      - feat/market-data-freshness-policy

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format source
        run: npx prettier --write src/lib/market-data/freshness.ts
      - name: Export formatted source
        run: |
          echo BEGIN_FORMATTED_BASE64
          base64 -w0 src/lib/market-data/freshness.ts
          echo
          echo END_FORMATTED_BASE64
