name: Temporary formatter export

on:
  push:
    branches:
      - feat/ui/plain-farmer-workspace

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format source files
        run: npx prettier --write "src/app/(workspace)/farmer/page.tsx" src/app/globals.css
      - name: Export formatted source
        run: |
          echo BEGIN_PAGE_BASE64
          base64 -w0 "src/app/(workspace)/farmer/page.tsx"
          echo
          echo END_PAGE_BASE64
          echo BEGIN_CSS_BASE64
          base64 -w0 src/app/globals.css
          echo
          echo END_CSS_BASE64
