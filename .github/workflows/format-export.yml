name: Temporary formatter export

on:
  push:
    branches:
      - feat/net-return-comparison-rebased

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format comparison source and tests
        run: npx prettier --write src/features/comparison/net-realisation-comparison.ts src/features/comparison/net-realisation-comparison.test.ts
      - name: Export formatted sources
        run: |
          echo BEGIN_DOMAIN_BASE64
          base64 -w0 src/features/comparison/net-realisation-comparison.ts
          echo
          echo END_DOMAIN_BASE64
          echo BEGIN_TEST_BASE64
          base64 -w0 src/features/comparison/net-realisation-comparison.test.ts
          echo
          echo END_TEST_BASE64
