name: Logistics request terms

on:
  pull_request:
    paths:
      - "src/features/logistics/request-terms.ts"
      - "src/features/logistics/request-terms.test.ts"
      - "docs/LOGISTICS_REQUEST_TERMS.md"
      - ".github/workflows/logistics-request-terms.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test src/features/logistics/request-terms.test.ts
