name: Market source date integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/market-data/source-integrity.ts"
      - "src/lib/market-data/source-integrity.test.ts"
      - ".github/workflows/market-source-integrity.yml"
  push:
    branches:
      - "feat/market-data-source-integrity"

permissions:
  contents: read

jobs:
  market-source-integrity:
    name: Market source date integrity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print Prettier-formatted test for CI diagnosis
        run: npx prettier --write src/lib/market-data/source-integrity.test.ts && cat src/lib/market-data/source-integrity.test.ts

      - name: Run focused tests
        run: node --experimental-strip-types --test src/lib/market-data/source-integrity.test.ts
