name: M6 marketplace lifecycle QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lifecycle-journey:
    name: Marketplace lifecycle journey tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Marketplace lifecycle journey tests
        run: node --experimental-strip-types --test src/features/marketplace/lifecycle-journey.test.ts
