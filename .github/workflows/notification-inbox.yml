name: Notification inbox tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/notifications/**"
      - ".github/workflows/notification-inbox.yml"
  push:
    branches:
      - "feat/notifications-inbox-foundation"

permissions:
  contents: read

jobs:
  notification-inbox:
    name: Notification inbox contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preview exact Prettier output (temporary diagnostic)
        run: |
          cp src/features/notifications/inbox.ts /tmp/inbox.ts
          cp src/features/notifications/inbox.test.ts /tmp/inbox.test.ts
          npx prettier --write src/features/notifications/inbox.ts src/features/notifications/inbox.test.ts
          diff -u /tmp/inbox.ts src/features/notifications/inbox.ts || true
          diff -u /tmp/inbox.test.ts src/features/notifications/inbox.test.ts || true
          git checkout -- src/features/notifications/inbox.ts src/features/notifications/inbox.test.ts

      - name: Run notification inbox tests
        run: node --experimental-strip-types --test src/features/notifications/inbox.test.ts
