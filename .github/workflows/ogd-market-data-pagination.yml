name: OGD market-data pagination

on:
  push:
    branches:
      - feat/ogd-market-data-pagination
      - feat/market-source-quality-diagnostics
      - feat/market-source-quality-ui
  pull_request:
    branches:
      - feat/market-import-duplicate-reconciliation
      - feat/ogd-market-data-pagination
      - feat/market-source-quality-diagnostics
    paths:
      - "src/lib/market-data/ogd-pagination.ts"
      - "src/lib/market-data/ogd-pagination.test.ts"
      - "src/lib/market-data/ogd-provider.ts"
      - "src/lib/market-data/normalize.ts"
      - "src/lib/market-data/types.ts"
      - "src/lib/market-data/normalize-diagnostics.test.ts"
      - "src/lib/market-data/source-quality.ts"
      - "src/lib/market-data/source-quality.test.ts"
      - "src/features/market-data/source-quality-panel.tsx"
      - "src/features/market-data/source-quality-panel.module.css"
      - "src/app/(workspace)/farmer/markets/page.tsx"
      - "src/app/api/market-data/refresh/route.ts"
      - "docs/OGD_MARKET_DATA_PAGINATION.md"
      - "docs/OGD_SOURCE_QUALITY_DIAGNOSTICS.md"
      - "docs/MARKET_SOURCE_QUALITY_UI.md"
      - ".github/workflows/ogd-market-data-pagination.yml"

permissions:
  contents: read

concurrency:
  group: ogd-market-data-pagination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npx prettier --check src/lib/market-data/source-quality.ts src/lib/market-data/source-quality.test.ts src/features/market-data/source-quality-panel.tsx src/features/market-data/source-quality-panel.module.css 'src/app/(workspace)/farmer/markets/page.tsx' docs/MARKET_SOURCE_QUALITY_UI.md src/lib/market-data/ogd-pagination.ts src/lib/market-data/ogd-pagination.test.ts src/lib/market-data/ogd-provider.ts src/lib/market-data/normalize.ts src/lib/market-data/types.ts src/lib/market-data/normalize-diagnostics.test.ts src/app/api/market-data/refresh/route.ts docs/OGD_MARKET_DATA_PAGINATION.md docs/OGD_SOURCE_QUALITY_DIAGNOSTICS.md .github/workflows/ogd-market-data-pagination.yml

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        if: always()
        run: npm test

      - name: Focused OGD tests
        if: always()
        run: node --experimental-strip-types --test src/lib/market-data/ogd-pagination.test.ts src/lib/market-data/normalize-diagnostics.test.ts src/lib/market-data/source-quality.test.ts

      - name: Production build
        if: always()
        run: npm run build
