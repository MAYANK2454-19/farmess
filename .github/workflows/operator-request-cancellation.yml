name: Operator accepted request cancellation

on:
  pull_request:
    paths:
      - "src/app/api/operator/requests/route.ts"
      - "src/features/operators/request-cancellation.ts"
      - "src/features/operators/request-cancellation.test.ts"
      - "src/features/operators/operator-request-manager.tsx"
      - "src/lib/supabase/database.types.ts"
      - "supabase/migrations/20261124190000_farmess_operator_accepted_request_cancellation.sql"
      - "docs/OPERATOR_ACCEPTED_REQUEST_CANCELLATION.md"
      - "docs/APP_INTEGRATION_STATUS.md"
      - "README.md"
      - ".github/workflows/operator-request-cancellation.yml"
  push:
    branches:
      - main
      - "feat/operator-accepted-request-cancellation"
    paths:
      - "src/app/api/operator/requests/route.ts"
      - "src/features/operators/request-cancellation.ts"
      - "src/features/operators/request-cancellation.test.ts"
      - "src/features/operators/operator-request-manager.tsx"
      - "src/lib/supabase/database.types.ts"
      - "supabase/migrations/20261124190000_farmess_operator_accepted_request_cancellation.sql"
      - "docs/OPERATOR_ACCEPTED_REQUEST_CANCELLATION.md"
      - ".github/workflows/operator-request-cancellation.yml"

permissions:
  contents: read

concurrency:
  group: operator-request-cancellation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify formatting
        run: npx prettier --write src/features/operators/request-cancellation.test.ts && cat src/features/operators/request-cancellation.test.ts
      - name: Focused validation tests
        run: node --experimental-strip-types --test src/features/operators/request-cancellation.test.ts
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Full unit tests
        run: npm test
      - name: Production build
        run: npm run build
