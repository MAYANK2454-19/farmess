name: Produce quality inspection tests

on:
  pull_request:
    branches: [main, feat/ui/field-ready-farmess-redesign]
  push:
    branches: [main, feat/m6-produce-quality-inspection, feat/farmess-quality-inspection-rebased]

permissions:
  contents: read

jobs:
  quality-inspection:
    name: Produce quality inspection domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Quality inspection tests
        run: node --experimental-strip-types --test src/features/lots/quality-inspection.test.ts
