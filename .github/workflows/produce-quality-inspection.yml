name: Produce quality inspection tests

on:
  pull_request:
    branches: [main, feat/ui/field-ready-farmess-redesign]
  push:
    branches: [main, feat/m6-produce-quality-inspection, feat/farmess-quality-inspection-rebased, feat/produce-quality-inspection-workflow]

permissions:
  contents: read

jobs:
  quality-inspection:
    name: Produce quality inspection domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Prettier
        run: npm run format:check
        env:
          FORMAT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FORMAT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Full unit tests
        run: npm test
      - name: Focused quality inspection tests
        run: node --experimental-strip-types --test src/features/lots/quality-inspection.test.ts
      - name: Production build
        run: npm run build
