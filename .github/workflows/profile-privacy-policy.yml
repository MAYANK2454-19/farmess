name: Farmer privacy policy tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/profile/privacy-policy.ts"
      - "src/features/profile/privacy-policy.test.ts"
      - ".github/workflows/profile-privacy-policy.yml"
  push:
    branches:
      - "feat/profile-privacy-disclosure-policy"

permissions:
  contents: read

jobs:
  profile-privacy:
    name: Farmer privacy disclosure contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository dependencies
        run: npm ci

      - name: Preview pinned Prettier output (temporary diagnostic)
        run: |
          cp docs/PROFILE_PRIVACY_POLICY.md /tmp/profile-privacy.md
          cp src/features/profile/privacy-policy.ts /tmp/profile-privacy.ts
          ./node_modules/.bin/prettier --write docs/PROFILE_PRIVACY_POLICY.md src/features/profile/privacy-policy.ts
          diff -u /tmp/profile-privacy.md docs/PROFILE_PRIVACY_POLICY.md || true
          diff -u /tmp/profile-privacy.ts src/features/profile/privacy-policy.ts || true
          git checkout -- docs/PROFILE_PRIVACY_POLICY.md src/features/profile/privacy-policy.ts

      - name: Run farmer privacy policy tests
        run: node --experimental-strip-types --test src/features/profile/privacy-policy.test.ts
