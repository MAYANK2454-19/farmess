name: Refresh dependency lockfile and formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - .github/workflows/refresh-dependency-lockfile.yml

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and reconcile lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format changed source files
        run: |
          git fetch origin main
          mapfile -d '' FILES < <(
            git diff --name-only -z origin/main...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' \
              '*.json' '*.css' '*.scss' '*.md' '*.yml' '*.yaml'
          )
          if (("${#FILES[@]}" > 0)); then
            npx prettier --write "${FILES[@]}"
          fi

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit formatting and lockfile updates
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Formatting and lockfile are already current."
          else
            git commit -m "chore: format branch and refresh lockfile"
            git push origin "HEAD:refs/heads/$BRANCH_NAME"
          fi

      - name: Dispatch CI against the updated branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$BRANCH_NAME\"}"
