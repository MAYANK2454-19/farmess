name: Route authorization contract tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/auth/route-authorization.ts"
      - "src/lib/auth/route-authorization.test.ts"
      - ".github/workflows/route-authorization.yml"
  push:
    branches:
      - "feat/route-authorization-contract"

permissions:
  contents: read

jobs:
  route-authorization:
    name: Route authorization contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository dependencies
        run: npm ci

      - name: Preview pinned Prettier output (temporary diagnostic)
        run: |
          cp docs/ROUTE_AUTHORIZATION_CONTRACT.md /tmp/route-auth.md
          cp src/lib/auth/route-authorization.ts /tmp/route-auth.ts
          cp src/lib/auth/route-authorization.test.ts /tmp/route-auth.test.ts
          ./node_modules/.bin/prettier --write docs/ROUTE_AUTHORIZATION_CONTRACT.md src/lib/auth/route-authorization.ts src/lib/auth/route-authorization.test.ts
          diff -u /tmp/route-auth.md docs/ROUTE_AUTHORIZATION_CONTRACT.md || true
          diff -u /tmp/route-auth.ts src/lib/auth/route-authorization.ts || true
          diff -u /tmp/route-auth.test.ts src/lib/auth/route-authorization.test.ts || true
          git checkout -- docs/ROUTE_AUTHORIZATION_CONTRACT.md src/lib/auth/route-authorization.ts src/lib/auth/route-authorization.test.ts

      - name: Run route authorization tests
        run: node --experimental-strip-types --test src/lib/auth/route-authorization.test.ts
