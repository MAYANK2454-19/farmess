name: Sale activity timeline tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sale-activity:
    name: Sale activity domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Preview Prettier output for sale activity files
        run: |
          npx prettier --write src/features/marketplace/sale-activity.ts src/features/marketplace/sale-activity.test.ts
          git diff -- src/features/marketplace/sale-activity.ts src/features/marketplace/sale-activity.test.ts
      - name: Sale activity unit tests
        run: node --experimental-strip-types --test src/features/marketplace/sale-activity.test.ts
