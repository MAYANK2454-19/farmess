name: CSV export verification

on:
  push:
    branches:
      - feat/market-price-csv-export

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/market-price-csv-export
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npx prettier --write "src/lib/market-data/csv.ts" "src/lib/market-data/normalize.test.ts" "src/app/(workspace)/farmer/markets/page.tsx" "src/app/(workspace)/farmer/markets/markets.module.css"
      - name: Verify formatting
        run: npx prettier --check "src/lib/market-data/csv.ts" "src/lib/market-data/normalize.test.ts" "src/app/(workspace)/farmer/markets/page.tsx" "src/app/(workspace)/farmer/markets/markets.module.css"
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit formatting and remove temporary verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/lib/market-data/csv.ts" "src/lib/market-data/normalize.test.ts" "src/app/(workspace)/farmer/markets/page.tsx" "src/app/(workspace)/farmer/markets/markets.module.css"
          git commit -m "style(markets): apply verified Prettier formatting" || true
          git rm .github/workflows/verify-csv-export.yml
          git commit -m "chore(ci): remove temporary CSV verification workflow"
          git push origin HEAD:feat/market-price-csv-export
